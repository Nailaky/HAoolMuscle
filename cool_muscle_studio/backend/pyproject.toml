[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmstudio"
version = "0.4.0"
description = "Cool Muscle Studio : bibliothèque CML, simulateur CM1 et backend de l'app Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cm1sim = "cmstudio.sim.__main__:main"
cmstudio = "cmstudio.app.__main__:main"

[tool.setuptools.packages.find]
include = ["cmstudio*"]

[tool.setuptools.package-data]
cmstudio = ["data/*.yaml", "app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
