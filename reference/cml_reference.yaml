points_a_confirmer:
  description: "Captures réelles à demander (champ 'Commande CML' du YAML existant, avec le capteur 'Dernière réponse moteur' ou les logs ESPHome)."
  liste:
    - "Écho : forme exacte de l'écho d'une commande (ex : envoyer 'K55.1' puis 'K55.1=5')."
    - "?85 : bannière complète (ID, FW, HW)."
    - "?90 : format complet (une ligne par K ? ordre ? suffixe .id ? nombre de lignes ?)."
    - "?1000 : format complet avec au moins une banque de programme et une banque logique chargées, et la ligne du nombre de pas."
    - "?0 (ou ?1) : format d'une seule banque."
    - "?91, ?92, ?93, ?94 : formats (une ligne par registre ?)."
    - "? et ?P : formats."
    - "?95, ?96, ?97, ?98, ?99, ?70, ?71, ?74, ?51, ?52 : une ligne de réponse chacune."
    - "P15.1 (lecture simple d'un registre) et V1.1 contenant une chaîne."
    - "$ : réponse exacte ('Saved.1' ?)."
    - "_SKH : réponse à la lecture."
    - "Réponse à une commande invalide (ex : 'ZZZ.1') et à un K hors plage (ex : K55.1=0)."
    - "Téléchargement d'une banque : écho ligne par ligne ? message en fin de banque ?"
    - "K66=2, K67=10 pendant un mouvement : format des lignes de streaming, puis K66=0."
    - "Comportement après K37 : le redémarrage |4 est-il nécessaire ? (le YAML actuel le fait)."
    - "Le moteur répond-il aux ?x pendant un mouvement sans perturber celui-ci ? (supposé oui)."
