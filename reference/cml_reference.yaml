  UG:       {titre: "CM1-C User Guide v3.00 (PDF, 12/05/2025)", url: "https://docs.myostat.ca/__attachments/a_cfe485d66415d37ce0e1cf6bd2a0c3f022b96a09466892d515bd034ede77cc92/CM1-C%20User%20Guide-v3.00.pdf"}
  RT3:      {titre: "RT3 Quick Reference Guide (PDF, version 3.14.00)", url: "https://docs.myostat.ca/__attachments/a_2c88599644489f424aef48d6bac6a83169bdf034bb7a913ac4d04d0f96871913/RT3%20Quick%20Reference%20Guide.pdf"}
