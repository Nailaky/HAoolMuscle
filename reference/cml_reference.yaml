# =============================================================================
#  Référence structurée du protocole CML du Cool Muscle CM1-C (firmware RT3)
#  Construite à partir de la documentation officielle Myostat, le 2026-10-21.
#
#  Conventions :
#    source   : identifiant(s) de source (voir `sources` ci-dessous)
#    statut   : documente     = tiré tel quel de la documentation (défaut)
#               a_confirmer   = déduit ou observé, non documenté explicitement
#               conflit       = les sources se contredisent (détail dans `note`)
#    danger   : mouvement | configuration | arret | lecture | memoire
#               (sert à décider si l'interface demande une confirmation)
#  Aucune syntaxe n'est inventée : ce qui n'est pas documenté est listé dans
#  `points_a_confirmer` et dans docs/questions-ouvertes.md.
# =============================================================================

meta:
  produit: "Cool Muscle CM1-C (Myostat / Muscle Corporation)"
  firmware_reference: "RT3.14.xx (RT3.14.06 = dernière version publiée, 2023-03-31)"
  date_construction: "2026-10-21"
  version_schema: 1

