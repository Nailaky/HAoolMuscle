# -----------------------------------------------------------------------------
protocole:
  liaison_serie:
    niveaux: "TTL (IN1 = Rx moteur, OUT1 = Tx moteur)"
    vitesse_defaut: 38400
    vitesses_possibles: [9600, 19200, 38400, 57600]
    format: "8 bits de données, 1 bit de stop, sans parité, sans contrôle de flux"
    source: [WEB-GS, "UG §4.3.2"]
  terminaison_commande: "CR (0x0D) obligatoire à la fin de chaque commande"
  terminaison_reponse:
    defaut: "CR LF (K70=1)"
    alternative: "CR seul (K70=0)"
    source: ["WEB-K K70", "UG §11.1"]
  longueur_ligne_max: 40      # caractères avant le CR, dans les banques (UG §10.1.1)
  echo:
    description: "Le moteur renvoie l'écho de chaque commande, sauf si K23 contient le bit 8 (Disable Echo)."
    source: ["WEB-K K23", BRIEF]
    statut: a_confirmer
    note: "Format exact de l'écho (avec ou sans suffixe .id, avec CR LF) non documenté : à capturer."
  adressage:
    syntaxe: "<commande>.<id>  avec id = 1..15 (ex : P1.1=100, ^.2, ?96.3)"
    sans_id: "Sans suffixe, la commande va au dernier moteur adressé"
    max_moteurs: 15
    maitre: "Le moteur 1 (premier de la chaîne) est le maître ; tout passe par lui"
    source: [WEB-GS, "UG §4.4"]
  separateur_meme_ligne: ","    # plusieurs commandes sur une ligne, 40 caractères max (UG §10.1.1, §10.5.2)
  jonction: ":"                  # deux commandes exécutées simultanément dans une branche (UG §10.6)
  commentaire_fichier:
    cml: "/ ... (30 caractères max, non envoyé au moteur, syntaxe héritée)"
    cmp: "// ligne ou /* bloc */ (Control Room uniquement, non envoyé au moteur)"
    source: [CR-CMP, "UG §10.6", "UG §20.2.1"]
  banniere_demarrage:
    format_observe: "CM1 ID1 FW:... HW:..."
    source: [BRIEF, ESP]
    statut: a_confirmer
  messages_spontanes:
    - {format: "Ux.<id>=<n>", quand: "K23 bit 1 : changement d'état/alarme", source: ["WEB-K K23", ESP]}
    - {format: "Saved.<id>", quand: "après $", source: ["UG §9.1"]}
    - {format: "End!", quand: "fin de banque en pas à pas", source: ["UG §9.1"]}
    - {format: "Can't Back!", quand: "< impossible", source: ["UG §9.1"]}
    - {format: "error: CW Limit!!", quand: "fin de course atteinte", source: [WEB-INF]}
    - {format: "{<id>", quand: "mode RS-485 (K62≠0) : demande de parole", source: ["UG §8"]}
    - {format: "Mx...", quand: "K23 bit 32 : événement merge motion", source: [RT3], statut: a_confirmer}
    - {format: "lignes K66", quand: "streaming K66/K67 actif", source: [WEB-K66], statut: a_confirmer}

# -----------------------------------------------------------------------------
etats_ux:
  description: "Réponse à ?99 et messages Ux automatiques. Les codes s'additionnent (ex : 40 = 8 + 32)."
  source: [WEB-STAT, "UG §5.6", RT3]
  codes:
    - {valeur: 0,   nom: "En mouvement", alarme: false, desactive_moteur: false}
    - {valeur: 1,   nom: "Dépassement d'erreur de position (K56)", alarme: true, desactive_moteur: true}
    - {valeur: 2,   nom: "Survitesse ou surtension", alarme: true, desactive_moteur: true}
    - {valeur: 4,   nom: "Surcharge / surintensité (K57)", alarme: true, desactive_moteur: true}
    - {valeur: 8,   nom: "En position / prêt", alarme: false, desactive_moteur: false}
    - {valeur: 16,  nom: "Désactivé (commande ) ou entrée Motor Free)", alarme: false, desactive_moteur: true}
    - {valeur: 32,  nom: "Limite de couple atteinte en mode poussée (K60)", alarme: false, desactive_moteur: false}
    - {valeur: 64,  nom: "Erreur de communication (bit B6 du Statusword)", alarme: true, desactive_moteur: false, statut: a_confirmer, source: [WEB-DC]}
    - {valeur: 128, nom: "Surchauffe (K71)", alarme: true, desactive_moteur: true}
    - {valeur: 256, nom: "Mode poussée : position atteinte avant la fin du temps (K61)", alarme: false, desactive_moteur: false, note: "banque de programme mise en pause, moteur reste activé"}
    - {valeur: 512, nom: "Arrêt d'urgence (* ou entrée)", alarme: true, desactive_moteur: false, note: "ignore toute commande de mouvement jusqu'à *1"}
    - {valeur: 16384, nom: "Nouveau démarrage requis (B14)", statut: a_confirmer, source: [WEB-DC]}
    - {valeur: 32768, nom: "Origine atteinte (B15)", statut: a_confirmer, source: [WEB-DC]}
  note: "Les bits B6, B14 et B15 viennent du tableau Statusword de la page Direct Control, qui dit que ?99 renvoie le Statusword. Ils ne figurent pas dans la liste classique 0..512 : à vérifier sur le moteur."

# -----------------------------------------------------------------------------
commandes_directes:
  # Mouvement
  - {cmd: "P0=", nom: "Position cible dynamique", syntaxe: "P0.<id>=<pulses>", danger: configuration, source: ["UG §9.1"], note: "pris en compte au prochain ^"}
  - {cmd: "S0=", nom: "Vitesse dynamique", syntaxe: "S0.<id>=<unités K37>", danger: configuration, source: ["UG §9.1"], note: "modifiable pendant le mouvement"}
  - {cmd: "A0=", nom: "Accélération dynamique", syntaxe: "A0.<id>=<Kpps²>", danger: configuration, source: ["UG §9.1"], note: "modifiable pendant le mouvement"}
  - {cmd: "M0=", nom: "Couple dynamique", syntaxe: "M0.<id>=<% couple crête>", danger: configuration, source: ["UG §9.1"]}
  - {cmd: "^",   nom: "Exécuter le mouvement (P0,S0,A0,M0)", syntaxe: "^.<id>", danger: mouvement, source: ["UG §9.1"]}
  - {cmd: "^n",  nom: "Exécuter le mouvement avec les registres n (1..8)", syntaxe: "^<n>.<id>", danger: mouvement, source: ["UG §9.1"]}
  - {cmd: "~",   nom: "Déplacement relatif de P0 (résolution fixe 50 000 imp/tour)", syntaxe: "~.<id>", danger: mouvement, source: ["UG §9.1", RT3]}
  # Origine
  - {cmd: "|",   nom: "Recherche d'origine (K42..K48)", syntaxe: "|.<id>", danger: mouvement, source: ["UG §9.1"], note: "caractère barre verticale ASCII 124 ; délai max 5 min"}
  - {cmd: "|1",  nom: "Aller à la position 0", syntaxe: "|1.<id>", danger: mouvement, source: ["UG §9.1"], note: "vitesse/accélération = K42, K43"}
  - {cmd: "|2",  nom: "Position actuelle = origine (0)", syntaxe: "|2.<id>", danger: configuration, source: ["UG §9.1"]}
  - {cmd: "|4",  nom: "Redémarrage logiciel", syntaxe: "|4.<id>", danger: arret, source: ["UG §9.1"]}
  - {cmd: "|11", nom: "Effacer le compteur de tours (garde la position dans le tour)", syntaxe: "|11.<id>", danger: configuration, source: ["UG §9.1"]}
  # Activation
  - {cmd: "(",   nom: "Activer le moteur", syntaxe: "(.<id>", danger: mouvement, source: ["UG §9.1"], note: "peut provoquer un retour en position"}
  - {cmd: ")",   nom: "Désactiver le moteur (arbre libre, position suivie)", syntaxe: ").<id>", danger: arret, source: ["UG §9.1"]}
  # Sorties
  - {cmd: "O#",  nom: "Activer la sortie # (K34 = 3 ou 4)", syntaxe: "O<1|2>.<id>", danger: configuration, source: ["UG §9.1"]}
  - {cmd: "F#",  nom: "Désactiver la sortie #", syntaxe: "F<1|2>.<id>", danger: configuration, source: ["UG §9.1"]}
  # Mémoire
  - {cmd: "$",   nom: "Sauvegarder registres et banques en EEPROM", syntaxe: "$.<id>", danger: memoire, source: ["UG §9.1"], note: "réponse 'Saved.<id>' ; les K sont sauvés automatiquement (sauf _SKH=0)"}
  - {cmd: "_SKH", nom: "Sauvegarde automatique des K (et H)", syntaxe: "_SKH=<0|1>  /  _SKH (lecture)", danger: configuration, source: [WEB-K, "WEB-FW RT3.14.03"], note: "remis à 1 au redémarrage ; interdit dans les banques ; RT3.14.03+"}
  # Banques
  - {cmd: "[n",  nom: "Exécuter la banque de programme n", syntaxe: "[<n>.<id>", danger: mouvement, source: ["UG §9.1"]}
  - {cmd: "[Ln", nom: "Exécuter la banque logique n", syntaxe: "[L<n>.<id>", danger: mouvement, source: ["UG §9.1"]}
  - {cmd: "]",   nom: "Pause (arrêt immédiat) ; deux fois = terminer la banque", syntaxe: "].<id>  ou  ].<id>,].<id>", danger: arret, source: ["UG §9.1"]}
  - {cmd: "]L",  nom: "Terminer la banque logique", syntaxe: "]L.<id>", danger: arret, source: ["UG §9.1"]}
  - {cmd: "]1",  nom: "Pause seulement de ce moteur sur la chaîne", syntaxe: "]1", danger: arret, source: [RT3], statut: conflit, note: "RT3 seulement ; le User Guide utilise ].<id>. À confirmer."}
  - {cmd: "}",   nom: "Pause après la ligne en cours ; deux fois = terminer", syntaxe: "}.<id>", danger: arret, source: ["UG §9.1"]}
  - {cmd: ">",   nom: "Exécuter la ligne suivante (banque en pause)", syntaxe: ">.<id>", danger: mouvement, source: ["UG §9.1"], note: "'End!' après la dernière ligne"}
  - {cmd: "<",   nom: "Exécuter la ligne précédente (une seule)", syntaxe: "<.<id>", danger: mouvement, source: ["UG §9.1"], note: "'Can't Back!' si impossible"}
  - {cmd: "B100", nom: "Effacer toutes les banques de programme", syntaxe: "B100.<id>", danger: memoire, source: ["UG §10.5.2"]}
  - {cmd: "L100", nom: "Effacer toutes les banques logiques", syntaxe: "L100.<id>", danger: memoire, source: ["UG §10.7.2"]}
  # Arrêt d'urgence
  - {cmd: "*",   nom: "Arrêt d'urgence (tous les moteurs de la chaîne)", syntaxe: "*", danger: arret, source: ["UG §9.1"], note: "décélération maximale, programmes stoppés, plus aucune commande de mouvement acceptée"}
  - {cmd: "*1",  nom: "Annuler l'arrêt d'urgence", syntaxe: "*1", danger: configuration, source: ["UG §9.1"], note: "rien ne redémarre automatiquement"}
  # Registres (écriture / lecture)
  - {cmd: "<Reg><n>=", nom: "Écrire un registre", syntaxe: "P5.1=1000, S2.1=430, V2.1=\"Ux\"", danger: configuration, source: ["UG §10.3"]}
  - {cmd: "<Reg><n>",  nom: "Lire un registre", syntaxe: "P15.1  → réponse P15.1=<valeur>", danger: lecture, source: ["UG §10.3"]}
  # Direct Control
  - {cmd: "_mop=", nom: "Mode de fonctionnement Direct Control", syntaxe: "_mop=<0|2|4|10>", danger: configuration, source: [WEB-DC], note: "0 CML standard, 2 profil (P1,S1,A1,A2,R1,N1), 4 position dynamique, 10 couple (N1,S1,R1)"}
  # RS-485 / multi-nœuds
  - {cmd: "D#=", nom: "Attribuer l'ID RS-485 au moteur de numéro de série SN", syntaxe: "D<id>=<SN>", danger: configuration, source: ["UG §8.1"]}
  - {cmd: "{0",  nom: "RS-485 : diffusion / fin de communication", syntaxe: "{0", danger: configuration, source: ["UG §8.1"]}
  - {cmd: "{n",  nom: "RS-485 : adresser le nœud n (1..255)", syntaxe: "{<n>", danger: configuration, source: ["UG §8.1"]}
  - {cmd: "FFFFFFFFF", nom: "Sortir temporairement du mode Modbus (9 × F)", syntaxe: "FFFFFFFFF", danger: configuration, source: ["UG §14.3.2"]}

# -----------------------------------------------------------------------------
requetes:
  source: ["UG §9.1", RT3, WEB-MM]
  liste:
    - {cmd: "?",     retour: "P0, A0, S0 courants", format_reponse: null, statut: a_confirmer}
    - {cmd: "?x",    retour: "Tout le registre x (ex : ?P, ?S, ?A, ?M, ?V, ?N, ?R, ?T)", format_reponse: null, statut: a_confirmer, note: "RT3 : ?P,?S,?A,?M,?V,?N,?R"}
    - {cmd: "?0..?16", retour: "Une banque de programme", format_reponse: null, statut: conflit, note: "RT3 et UG disent 0..16 alors que 30 banques existent : à vérifier pour ?17..?30"}
    - {cmd: "?1000", retour: "Toutes les banques (programme + logiques) et le nombre de pas utilisés (200 max)", format_reponse: "en-tête 'B1.1' puis les lignes de la banque réécrites avec un espace après chaque virgule ('A2.1, S2.1, P3.1+'), sans END ; après les banques de programme une ligne '- Total 12 steps -', puis les banques logiques et '- Total 4 steps -'", statut: observe, source: [CAPTURE]}
    - {cmd: "?51",   retour: "État OUT1", format_reponse: null, statut: a_confirmer}
    - {cmd: "?52",   retour: "État OUT2", format_reponse: null, statut: a_confirmer}
    - {cmd: "?70",   retour: "État des entrées", format_reponse: null, statut: a_confirmer, note: "probablement binaire IN1=1 IN2=2 IN3=4 IN4=8 comme la variable \"IN\""}
    - {cmd: "?71",   retour: "Température du driver (°C)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?74",   retour: "Valeur de l'entrée analogique (IN4, 0..1023)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?76",   retour: "Valeur du compteur CH2 (hex selon RT3)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?79",   retour: "Temporisation du mode poussée", format_reponse: null, statut: a_confirmer}
    - {cmd: "?85",   retour: "ID moteur et version firmware (+ matériel)", format_reponse: "CM1 ID1 FW:... HW:... (observé)", statut: a_confirmer, source: [BRIEF, ESP]}
    - {cmd: "?90",   retour: "Tous les paramètres K", format_reponse: "plusieurs lignes, 4 paramètres par ligne séparés par des virgules : 'K20.1=0,K21.1=0,K22.1=200,K23.1=1' ; chiffres conservés (K26.1=0000, K28.1=0800) ; K79 à K84 présents", statut: observe, source: [CAPTURE]}
    - {cmd: "?91",   retour: "Toutes les positions (P)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?92",   retour: "Toutes les vitesses (S)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?93",   retour: "Toutes les accélérations (A)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?94",   retour: "Toutes les temporisations (T)", format_reponse: null, statut: a_confirmer}
    - {cmd: "?95",   retour: "Erreur de position", format_reponse: "Ex.<id>=<n> (probable, d'après la table Modbus)", statut: a_confirmer, source: [WEB-MB]}
    - {cmd: "?96",   retour: "Position courante", format_reponse: "Px.<id>=<n> (observé par le YAML ESP)", statut: a_confirmer, source: [ESP, WEB-MB]}
    - {cmd: "?97",   retour: "Vitesse courante", format_reponse: "Sx.<id>=<n> (probable)", statut: a_confirmer, source: [WEB-MB]}
    - {cmd: "?98",   retour: "Courant Iq moyenné / couple", format_reponse: "Tx.<id>=<n> ou Ix.<id>=<n> (à confirmer)", statut: conflit, note: "RT3 : 'Iq Real Averaged' ; table Modbus : 'Tx Actual Torque' ; K66=7 : 'Tx.1=xxx'"}
    - {cmd: "?99",   retour: "État moteur (codes Ux)", format_reponse: "Ux.<id>=<n> (observé)", statut: documente, source: [WEB-STAT, ESP]}
  note_pdf: "Dans le PDF UG §9.1 la colonne des descriptions de ?85..?99 est décalée d'une ligne (artefact de mise en page). La correspondance retenue est celle de la page web et du RT3."

# -----------------------------------------------------------------------------
registres:
  source: ["UG §10.3.1", RT3]
  familles:
    - {lettre: P, nom: "Position", indices: "0..25 (P0 = dynamique)", unite: "impulsions (résolution K37)", min: -1000000000, max: 1000000000, note: "1 000 000 000 = mouvement infini (sens donné par le signe de S)", source: ["UG §10.3.1", WEB-POS]}
    - {lettre: S, nom: "Vitesse", indices: "0..15", unite: "unité de vitesse K37 (100, 10 ou 1 imp/s)", min: -5000000, max: 5000000, source: ["UG §10.3.1", WEB-SPD]}
    - {lettre: A, nom: "Accélération", indices: "0..8", unite: "1000 imp/s²", min: -32767, max: 32767, source: ["UG §10.3.1", WEB-ACC]}
    - {lettre: M, nom: "Couple", indices: "0..8", unite: "% du couple crête", min: 0, max: 100, source: ["UG §10.3.1", WEB-TRQ]}
    - {lettre: T, nom: "Temporisation", indices: "1..8 (T0 = no-op)", unite: "ms", min: 0, max: 32767, source: ["UG §10.3.1"]}
    - {lettre: V, nom: "Variable", indices: "0..15", unite: "-", min: -2147483648, max: 2147483647, note: "entier, chaîne 4 caractères max, ou variable d'état entre guillemets", source: ["UG §10.3.1", RT3]}
    - {lettre: N, nom: "Centre (mouvement coordonné) / usage général", indices: "0..25", unite: "impulsions", min: -2147483648, max: 2147483647, note: "N0 = ordre du polynôme U5", source: ["UG §10.3.1", "UG §10.4.2"]}
    - {lettre: R, nom: "Rayon (mouvement coordonné) / usage général / Controlword", indices: "0..25", unite: "impulsions", min: -1000000000, max: 1000000000, note: "R0 = mot de commande dans le programme Modbus ; R1 = Controlword en Direct Control", source: ["UG §10.3.1", WEB-DC, WEB-MB]}
    - {lettre: H, nom: "Gains du régulateur H-infini", indices: "0..7", unite: "-", note: "voir parametres_h", source: [WEB-TUNE]}
    - {lettre: K, nom: "Paramètres de configuration", indices: "14..90", note: "voir parametres_k", source: [WEB-K]}
  plages_rt3:
    note: "Le RT3 donne des plages d'indices parfois différentes : P1-P25, S1-S15, A1-A8, M1-M8, T1-T8, R1-R25, N1-N25, V1-V15, U1-U6 (fonctions)."

variables_internes:
  description: "Affectées à un registre V entre guillemets, ex : V2.1=\"Px\""
  source: ["UG §10.3.2", WEB-FW]
  liste:
    - {nom: "Ux",   acces: RO,  unite: "-", description: "État moteur (codes Ux)"}
    - {nom: "Px",   acces: RW,  unite: "impulsions", description: "Position (écriture = fixe la position, moteur à l'arrêt)"}
    - {nom: "Sx",   acces: RO,  unite: "impulsions/s", description: "Vitesse"}
    - {nom: "Ix",   acces: RO,  unite: "-", description: "Courant moteur (plage selon modèle : 17L30 ±110)"}
    - {nom: "Tx",   acces: RO,  unite: "-", description: "Courant cible"}
    - {nom: "Ex",   acces: RO,  unite: "-", description: "État d'erreur seul (sous-ensemble alarme de Ux)"}
    - {nom: "Pe",   acces: RO,  unite: "impulsions", description: "Erreur de position"}
    - {nom: "Pt",   acces: RO,  unite: "impulsions", description: "Cible de position 1 ms du générateur"}
    - {nom: "St",   acces: RW,  unite: "impulsions/ms", description: "Prochaine cible de vitesse (écriture toutes les 1 ms, déconseillé)"}
    - {nom: "Dx",   acces: RW,  unite: "impulsions", description: "Prochaine cible de position (écriture toutes les 1 ms, déconseillé)"}
    - {nom: "AIN4", acces: RO,  unite: "0..1023", description: "Entrée analogique IN4"}
    - {nom: "Fx",   acces: RO,  unite: "Hz", description: "Fréquence IN2 (K63=3)"}
    - {nom: "Cx",   acces: RW,  unite: "-", description: "Compteur rapide IN2 (jusqu'à 2 MHz)"}
    - {nom: "Cx2",  acces: RW,  unite: "-", description: "Compteur IN2 (1 ms, anti-rebond)"}
    - {nom: "Cx3",  acces: RW,  unite: "-", description: "Compteur IN3"}
    - {nom: "Cx4",  acces: RW,  unite: "-", description: "Compteur IN4"}
    - {nom: "AO2",  acces: RW,  unite: "0..255", description: "Sortie analogique OUT2 (K34 = 0)"}
    - {nom: "IN",   acces: RO,  unite: "bits", description: "IN1=1 IN2=2 IN3=4 IN4=8 (RT3.14.04+)"}
    - {nom: "INMK", acces: RW,  unite: "bits", description: "Masque des entrées pour IN (défaut 15)"}
    - {nom: "IN1R..IN4R", acces: RO, unite: "-", description: "Nombre de fronts montants depuis la dernière lecture (RT3.14.04+)"}
    - {nom: "IN1F..IN4F", acces: RO, unite: "-", description: "Nombre de fronts descendants depuis la dernière lecture (RT3.14.04+)"}
    - {nom: "Tmr",  acces: RW,  unite: "ms", description: "Compte à rebours 1 ms (0..32767)"}
    - {nom: "Cnt",  acces: RW,  unite: "ms", description: "Compteur libre 1 ms"}
    - {nom: "PTmr", acces: RW,  unite: "ms", description: "Temps de poussée (comme K61)"}
    - {nom: "PV%",  acces: RW,  unite: "0.1 % couple crête", description: "Valeur de poussée (0..800)"}
    - {nom: "PVal", acces: RW,  unite: "-", description: "Déprécié, utiliser PV%"}
    - {nom: "DPos", acces: RW,  unite: "0|1|2", description: "Déprécié : comportement de P0 pendant le mouvement"}
    - {nom: "MOP",  acces: RW,  unite: "0|2|4|10", description: "Mode Direct Control"}
    - {nom: "EEP1", acces: RW,  unite: "32 bits", description: "Mémoire non volatile 1 (écritures limitées)"}
    - {nom: "EEP2", acces: RW,  unite: "32 bits", description: "Mémoire non volatile 2"}
    - {nom: "What", acces: RW,  unite: "chaîne", description: "Chaîne de 4 caractères max (RT3)", source: [RT3]}

# -----------------------------------------------------------------------------
banques:
  source: ["UG §10", WEB-PM]
  limites: {banques_programme: 30, banques_logiques: 30, pas_total_max: 200, caracteres_par_ligne_max: 40}
  syntaxe:
    debut_programme: "B<n>"
    debut_logique: "L<n>"
    fin: "END"
    regles:
      - "Une erreur de syntaxe arrête le chargement de la banque à partir de ce point ; relire avec ?1000 pour vérifier."
      - "Dans une banque, un registre ne peut pas recevoir une constante numérique (A1.1=100 interdit) ; il doit être copié d'un autre registre (A1.1=V1.1). CMP de Control Room contourne cela en allouant un registre libre."
      - "Les commandes d'une même ligne sont groupées (équation ou branche) ; les commandes consécutives sont sur des lignes séparées (CR) ou séparées par des virgules."
      - "Les registres doivent être initialisés avant l'appel de la banque."
      - "Il est recommandé de commencer un fichier par B100 et L100."
      - "Terminer par $ pour sauvegarder en EEPROM."
    source: ["UG §10.1.1", "UG §10.3", "UG §10.5.2"]
  commandes_programme_source: ["UG §10.5.2", "UG §17", RT3]
  commandes_programme:
    - {cmd: "B#",  description: "Début de la banque de programme #"}
    - {cmd: "P#",  description: "Aller à la position P# (attend l'arrivée) ; P#+ = incrémental"}
    - {cmd: "S#",  description: "Vitesse du prochain mouvement"}
    - {cmd: "A#",  description: "Accélération du prochain mouvement"}
    - {cmd: "M#",  description: "Couple du prochain mouvement"}
    - {cmd: "X# / X-", description: "Boucle # fois (X0 = infinie, 255 max selon RT3), X- ferme la boucle ; boucles imbriquées autorisées"}
    - {cmd: "Y#",  description: "Comme P# sans attendre la fin du mouvement"}
    - {cmd: "Q#",  description: "Mouvement en poussée vers P# (attend la fin du temps K61)"}
    - {cmd: "Z#",  description: "Q# sans attendre"}
    - {cmd: ",",   description: "Concaténation / mouvements simultanés (moteurs en ordre décroissant : P1.2,P3.1)"}
    - {cmd: ";",   description: "Fin de ligne : fusionner avec le mouvement suivant (merge motion)"}
    - {cmd: "C#",  description: "Appeler la banque de programme # puis revenir"}
    - {cmd: "J#",  description: "Sauter à la banque de programme # sans retour"}
    - {cmd: "@#",  description: "Mouvement coordonné vers P# (2 moteurs consécutifs, dans une banque de programme uniquement) ; @#+ / @#- sens de l'arc"}
    - {cmd: "B100", description: "Effacer toutes les banques de programme"}
  commandes_communes_source: ["UG §10.6"]
  commandes_communes:
    - {cmd: "I#",  description: "Branche sur l'entrée # (I1..I4), ex : I1.1,C2.1,C3.1"}
    - {cmd: "W0 / W#", description: "Attendre que la condition soit vraie / au plus T# ms"}
    - {cmd: "T0 / T#", description: "Ne rien faire / attendre T# ms"}
    - {cmd: "END", description: "Fin de banque"}
    - {cmd: ":",   description: "Jonction : deux commandes simultanées (I1.1,?96:?97,W0)"}
    - {cmd: "/",   description: "Commentaire (non envoyé au moteur, 30 caractères, hérité)"}
  commandes_logiques_source: ["UG §10.7.2"]
  commandes_logiques:
    - {cmd: "L#",  description: "Début de la banque logique # (boucle en continu, période K87)"}
    - {cmd: ";",   description: "Fin d'une opération mathématique : ne pas renvoyer le résultat sur le port série (sens différent du ; de programme)"}
    - {cmd: "CL#", description: "Appeler la banque logique #"}
    - {cmd: "JL#", description: "Sauter à la banque logique #"}
    - {cmd: "L100", description: "Effacer toutes les banques logiques"}
  branchements:
    format: "REQUÊTE, SI_VRAI, SI_FAUX"
    operateurs: ["I# (entrée seule)", "&&", "||", "!!", ">", ">=", "==", "<", "<=", "!= (vu dans l'exemple Modbus)"]
    exemple: "V1>=V2, ?99, ?96"
    source: ["UG §10.2", WEB-MB]
  math:
    basiques: ["=", "+", "-", "*", "/"]
    avancees:
      - {fn: "U1(x)", description: "Sinus (mis à l'échelle)"}
      - {fn: "U2(x)", description: "Cosinus"}
      - {fn: "U3(x)", description: "Racine carrée (entière)"}
      - {fn: "U4",    description: "Table de correspondance (RT3 seulement, non détaillé)", statut: a_confirmer}
      - {fn: "U5(x)", description: "Polynôme avec coefficients N1..N25, ordre N0"}
      - {fn: "U6(x)", description: "Polynôme avec coefficients R1..R25, ordre R0"}
    source: ["UG §10.4", RT3]

# -----------------------------------------------------------------------------
parametres_k:
  source_principale: [WEB-K, "UG §11"]
  note_sauvegarde: "Les K sont sauvés automatiquement en EEPROM à chaque écriture (usure) ; _SKH=0 désactive cette sauvegarde jusqu'au prochain redémarrage."
  liste:
    - {k: 14, nom: "Délai de mise sous tension", unite: "ms", type: int, min: 0, max: 32000, defaut: 0}
    - {k: 20, nom: "Vitesse série principale (UART0) / mode Modbus", unite: "bit/s", type: enum, defaut: 0,
       valeurs: {0: "38400", 1: "9600", 2: "19200", 3: "57600", 10: "38400 Modbus", 11: "9600 Modbus", 12: "19200 Modbus", 13: "57600 Modbus"},
       avertissement: "Changer K20 coupe la liaison avec le pont ESP32 (38400 fixe)."}
    - {k: 21, nom: "Boucle semi-fermée : zone en boucle ouverte autour de la cible", unite: "0,1°", type: int, min: 0, max: 36, defaut: 0, note: "0 = boucle fermée complète"}
    - {k: 22, nom: "Délai avant passage en boucle ouverte (K21)", unite: "ms", type: int, min: 10, max: 1000, defaut: 0, statut: conflit, note: "Défaut documenté 0 alors que min = 10."}
    - {k: 23, nom: "Événements envoyés spontanément sur le port série (bits cumulables)", unite: "-", type: bits, defaut: 1,
       bits: {1: "Tous les codes d'état et d'alarme (Ux)", 2: "État des entrées", 4: "État des sorties", 8: "Désactiver l'écho", 16: "Avertissements et messages", 32: "Événement merge motion (Mx)"},
       avertissement: "Le pont ESP32 a besoin du bit 1 (Ux) et de l'écho (bit 8 absent)."}
    - {k: 24, nom: "Intervalle de la sortie quadrature", unite: "impulsions", type: int, min: 4, max: 32767, defaut: 1000}
